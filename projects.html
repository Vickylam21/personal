<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LIN Yang 的项目集。" />
    <title>PROJECTS / LIN Yang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #000; color: #fff; font-family: 'Space Grotesk', Arial, sans-serif; }
      .shell { width: min(100%, 1600px); margin: 0 auto; padding: 0 clamp(1.25rem, 4vw, 5rem); }
      .title { font-size: clamp(5rem, 17vw, 17rem); line-height: .72; letter-spacing: -.1em; font-weight: 700; }
      .line { border-color: #242424; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <header class="shell flex items-center justify-between border-b line py-5 text-xs uppercase tracking-[.18em] text-[#aaa]">
      <a href="index.html" class="text-white no-underline">LIN / 00</a><div class="flex items-center gap-5"><button class="language-switch text-white" type="button">繁中 / EN</button><a href="index.html" data-zh="關閉 ↗" data-en="Close ↗">Close ↗</a></div>
    </header>
    <main class="shell">
      <section class="min-h-[75vh] py-28 sm:py-48"><p class="mb-24 text-xs uppercase tracking-[.2em] text-[#aaa]" data-zh="01 / 項目集" data-en="01 / Selected work">01 / Selected work</p><h1 class="title uppercase" data-zh="項<br />目集" data-en="Pro<br />jects">Pro<br />jects</h1></section>
      <section class="border-t line py-24 sm:py-36">
        <div class="grid border-t line">
          <a href="#" class="grid grid-cols-[4rem_1fr] gap-4 border-b line py-10 no-underline sm:grid-cols-[6rem_1fr_auto] sm:items-baseline"><span class="text-xs text-[#aaa]">001</span><span class="text-4xl uppercase tracking-[-.07em] sm:text-7xl">Noma Objects</span><span class="text-xs uppercase tracking-[.15em] text-[#aaa]">Identity / Web</span></a>
          <a href="#" class="grid grid-cols-[4rem_1fr] gap-4 border-b line py-10 no-underline sm:grid-cols-[6rem_1fr_auto] sm:items-baseline"><span class="text-xs text-[#aaa]">002</span><span class="text-4xl uppercase tracking-[-.07em] sm:text-7xl">Common Ground</span><span class="text-xs uppercase tracking-[.15em] text-[#aaa]">Campaign / Digital</span></a>
          <a href="#" class="grid grid-cols-[4rem_1fr] gap-4 border-b line py-10 no-underline sm:grid-cols-[6rem_1fr_auto] sm:items-baseline"><span class="text-xs text-[#aaa]">003</span><span class="text-4xl uppercase tracking-[-.07em] sm:text-7xl">After Hours FM</span><span class="text-xs uppercase tracking-[.15em] text-[#aaa]">Art Direction</span></a>
          <a href="#" class="grid grid-cols-[4rem_1fr] gap-4 border-b line py-10 no-underline sm:grid-cols-[6rem_1fr_auto] sm:items-baseline"><span class="text-xs text-[#aaa]">004</span><span class="text-4xl uppercase tracking-[-.07em] sm:text-7xl">Open Archive</span><span class="text-xs uppercase tracking-[.15em] text-[#aaa]">Experience / Code</span></a>
        </div>
      </section>
    </main>
    <footer class="shell border-t line py-8 text-xs uppercase tracking-[.16em] text-[#aaa]"><a href="index.html" data-zh="← 返回 LIN Yang" data-en="← Return to LIN Yang">← Return to LIN Yang</a></footer>
  </body>
  <script>
    const languageSwitch = document.querySelector('.language-switch');
    const translatableItems = document.querySelectorAll('[data-zh][data-en]');
    let currentLanguage = localStorage.getItem('lin-language') || 'zh';
    const applyLanguage = (language) => {
      currentLanguage = language;
      translatableItems.forEach((item) => { item.innerHTML = item.dataset[language]; });
      languageSwitch.textContent = language === 'zh' ? '繁中 / EN' : 'EN / 繁中';
      document.documentElement.lang = language === 'zh' ? 'zh-Hant' : 'en';
      localStorage.setItem('lin-language', language);
    };
    languageSwitch.addEventListener('click', () => applyLanguage(currentLanguage === 'zh' ? 'en' : 'zh'));
    applyLanguage(currentLanguage);
  </script>
</html>
